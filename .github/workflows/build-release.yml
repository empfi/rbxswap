name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so the changelog can diff against the previous
          # release tag.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup .NET (for native helper)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx electron-builder --win --x64 --publish never
        env:
          # Skip code signing on CI (no certificate available)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/rbxSWAP*.exe release/ -ErrorAction SilentlyContinue
          Copy-Item dist/*.blockmap release/ -ErrorAction SilentlyContinue
          Get-ChildItem release

      - name: Generate changelog
        shell: pwsh
        run: |
          $prev = git tag --sort=-creatordate | Select-Object -First 1
          if ($prev) { $range = "$prev..HEAD" } else { $range = 'HEAD' }
          $commits = git log $range --no-merges --pretty=format:'- %s (%h)'
          if (-not $commits) { $commits = '- No new commits since the last build.' }
          $lines = @()
          $lines += "Automated build of master (${{ github.sha }})."
          $lines += ''
          if ($prev) { $lines += "### Changes since $prev" } else { $lines += '### Changes' }
          $lines += ''
          $lines += $commits
          if ($prev) {
            $lines += ''
            $lines += "**Full changelog**: https://github.com/${{ github.repository }}/compare/$prev...${{ github.sha }}"
          }
          $lines -join "`n" | Set-Content -Path changelog.md -Encoding utf8
          Get-Content changelog.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body_path: changelog.md
          draft: false
          prerelease: false
          files: release/*
